<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OGP template for 減算ゼロ guide pages. generate-og.mjs fills the {{...}} slots. -->
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#f3efe6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#wash)"/>
  <!-- soft shapes, right side -->
  <circle cx="1095" cy="120" r="210" fill="#e5f2ee"/>
  <circle cx="1150" cy="560" r="150" fill="#fbefe4"/>
  <!-- document with checks -->
  <g transform="translate(948 330) rotate(6)">
    <rect x="0" y="0" width="170" height="214" rx="14" fill="#ffffff" stroke="#e3e0d8" stroke-width="3"/>
    <rect x="22" y="26" width="96" height="12" rx="6" fill="#1d6f5f"/>
    <g fill="none" stroke="#1d6f5f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 78 l12 12 l22 -24"/><path d="M24 128 l12 12 l22 -24"/><path d="M24 178 l12 12 l22 -24"/>
    </g>
    <rect x="72" y="78" width="74" height="10" rx="5" fill="#e3e0d8"/>
    <rect x="72" y="128" width="62" height="10" rx="5" fill="#e3e0d8"/>
    <rect x="72" y="178" width="70" height="10" rx="5" fill="#e3e0d8"/>
  </g>
  <!-- leaf -->
  <path d="M1012 300 C 1012 240, 1062 214, 1098 214 C 1098 262, 1066 300, 1012 300 Z" fill="#1d6f5f" opacity=".85"/>
  <path d="M1012 300 C 1040 270, 1066 246, 1094 220" stroke="#e5f2ee" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- left rule -->
  <rect x="0" y="0" width="16" height="630" fill="#1d6f5f"/>
  <!-- brand -->
  <g font-family="'Zen Kaku Gothic New','Noto Sans JP','Hiragino Sans',sans-serif">
    <circle cx="96" cy="88" r="22" fill="#1d6f5f"/>
    <path d="M86 88 l7 7 l13 -14" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="130" y="100" font-size="34" font-weight="700" fill="#1f2a2e">減算ゼロ</text>
    <text x="74" y="186" font-size="26" font-weight="700" fill="#1d6f5f" letter-spacing="2">{{EYEBROW}}</text>
    <text x="74" y="{{TITLE_Y}}" font-size="{{TITLE_SIZE}}" font-weight="700" fill="#1f2a2e">{{TITLE_TSPANS}}</text>
    <text x="74" y="{{SUB_Y}}" font-size="30" font-weight="500" fill="#5b676c">{{SUB_TSPANS}}</text>
    <text x="74" y="574" font-size="24" font-weight="500" fill="#5b676c">障害福祉サービス事業所向け ・ 令和6年度報酬改定対応</text>
  </g>
</svg>
