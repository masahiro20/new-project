<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="t d">
  <title id="t">事業所のスタッフが書類を一緒に確認している様子</title>
  <desc id="d">障害福祉サービス事業所で、職員と利用者が机を囲み、チェック済みの書類と年間の予定を確認しているイラスト。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfaf7"/><stop offset="1" stop-color="#f4efe5"/></linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e5f2ee"/><stop offset="1" stop-color="#cfe6de"/></linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#sky)"/>
  <!-- soft backdrop shapes -->
  <circle cx="860" cy="300" r="300" fill="#e5f2ee"/>
  <circle cx="1080" cy="120" r="70" fill="#fbefe4"/>
  <circle cx="250" cy="640" r="190" fill="#fbefe4" opacity=".8"/>
  <!-- building (the office) -->
  <g>
    <rect x="620" y="170" width="420" height="300" rx="18" fill="#ffffff" stroke="#e3e0d8" stroke-width="4"/>
    <path d="M600 186 L830 70 L1060 186" fill="none" stroke="#1d6f5f" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="660" y="214" width="96" height="76" rx="10" fill="url(#win)"/>
    <rect x="782" y="214" width="96" height="76" rx="10" fill="url(#win)"/>
    <rect x="904" y="214" width="96" height="76" rx="10" fill="url(#win)"/>
    <rect x="660" y="316" width="96" height="76" rx="10" fill="url(#win)"/>
    <rect x="904" y="316" width="96" height="76" rx="10" fill="url(#win)"/>
    <rect x="790" y="330" width="80" height="140" rx="10" fill="#1d6f5f"/>
    <circle cx="854" cy="404" r="5" fill="#fbefe4"/>
    <!-- heart sign -->
    <circle cx="830" cy="140" r="26" fill="#fbefe4"/>
    <path d="M830 152 C 812 140, 812 126, 822 124 C 828 123, 830 128, 830 130 C 830 128, 832 123, 838 124 C 848 126, 848 140, 830 152 Z" fill="#9a4a12"/>
  </g>
  <!-- ground -->
  <rect x="0" y="600" width="1200" height="80" fill="#efe9dd"/>
  <path d="M0 600 H1200" stroke="#e3e0d8" stroke-width="4"/>
  <!-- trees -->
  <g>
    <rect x="1086" y="420" width="12" height="180" rx="6" fill="#8b7a62"/>
    <circle cx="1092" cy="400" r="62" fill="#1d6f5f" opacity=".9"/>
    <circle cx="1060" cy="440" r="40" fill="#2f8a74"/>
  </g>
  <!-- table -->
  <rect x="250" y="470" width="300" height="22" rx="11" fill="#c9a77c"/>
  <rect x="276" y="492" width="16" height="108" rx="8" fill="#a98a62"/>
  <rect x="508" y="492" width="16" height="108" rx="8" fill="#a98a62"/>
  <!-- document on table -->
  <g transform="translate(300 386) rotate(-6)">
    <rect width="150" height="96" rx="10" fill="#ffffff" stroke="#e3e0d8" stroke-width="3"/>
    <g fill="none" stroke="#1d6f5f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 26 l8 8 l14 -16"/><path d="M16 56 l8 8 l14 -16"/></g>
    <rect x="50" y="24" width="80" height="9" rx="4.5" fill="#e3e0d8"/><rect x="50" y="54" width="66" height="9" rx="4.5" fill="#e3e0d8"/><rect x="16" y="78" width="110" height="8" rx="4" fill="#e3e0d8"/>
  </g>
  <!-- mug -->
  <rect x="470" y="434" width="34" height="38" rx="8" fill="#ffffff" stroke="#e3e0d8" stroke-width="3"/>
  <path d="M504 444 c14 0 14 18 0 18" fill="none" stroke="#e3e0d8" stroke-width="3"/>
  <!-- staff member (standing, pointing at the document) -->
  <g transform="translate(-40 0)">
    <circle cx="200" cy="262" r="40" fill="#e2ad80"/>
    <path d="M160 258 C 160 210, 240 206, 242 254 C 226 236, 182 236, 160 258 Z" fill="#3b3027"/>
    <path d="M150 330 C 150 300, 250 300, 250 330 L 258 470 L 142 470 Z" fill="#1d6f5f"/>
    <rect x="186" y="318" width="28" height="40" rx="6" fill="#ffffff"/>
    <rect x="190" y="326" width="20" height="6" rx="3" fill="#1d6f5f"/>
    <path d="M242 336 C 290 360, 320 382, 350 404" stroke="#1d6f5f" stroke-width="26" stroke-linecap="round" fill="none"/>
    <circle cx="352" cy="406" r="14" fill="#e2ad80"/>
    <rect x="160" y="470" width="30" height="130" rx="12" fill="#2a3a3f"/>
    <rect x="210" y="470" width="30" height="130" rx="12" fill="#2a3a3f"/>
  </g>
  <!-- person in wheelchair (reviewing together) -->
  <g transform="translate(60 0)">
    <path d="M520 452 L 452 458 L 448 548" fill="none" stroke="#2a3a3f" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="520" cy="302" r="38" fill="#f1c8a5"/>
    <path d="M482 300 C 480 250, 560 246, 560 300 C 548 280, 500 278, 482 300 Z" fill="#6b4a33"/>
    <path d="M480 360 C 480 336, 560 336, 560 360 L 566 460 L 474 460 Z" fill="#9a4a12"/>
    <path d="M488 380 C 460 400, 448 420, 440 432" stroke="#9a4a12" stroke-width="24" stroke-linecap="round" fill="none"/>
    <circle cx="438" cy="434" r="13" fill="#f1c8a5"/>
    <!-- wheelchair -->
    <circle cx="560" cy="540" r="62" fill="none" stroke="#5b676c" stroke-width="10"/>
    <circle cx="560" cy="540" r="8" fill="#5b676c"/>
    <path d="M470 460 H 596 V 360" fill="none" stroke="#5b676c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M480 460 L 470 560 H 430" fill="none" stroke="#5b676c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="474" cy="590" r="12" fill="#5b676c"/>
  </g>
  <!-- speech bubble with check -->
  <g transform="translate(330 180)">
    <path d="M0 22 C0 8 10 0 24 0 H118 C132 0 142 8 142 22 V58 C142 72 132 80 118 80 H54 L30 104 L34 80 H24 C10 80 0 72 0 58 Z" fill="#ffffff" stroke="#e3e0d8" stroke-width="3"/>
    <circle cx="40" cy="40" r="20" fill="#1d6f5f"/>
    <path d="M30 40 l7 7 l13 -14" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="70" y="30" width="54" height="8" rx="4" fill="#e3e0d8"/><rect x="70" y="46" width="40" height="8" rx="4" fill="#e3e0d8"/>
  </g>
  <!-- yearly calendar card -->
  <g transform="translate(70 70)">
    <rect width="190" height="150" rx="16" fill="#ffffff" stroke="#e3e0d8" stroke-width="3"/>
    <rect width="190" height="40" rx="16" fill="#1d6f5f"/><rect y="24" width="190" height="16" fill="#1d6f5f"/>
    <circle cx="44" cy="0" r="7" fill="#9a4a12"/><circle cx="146" cy="0" r="7" fill="#9a4a12"/>
    <g fill="#e5f2ee">
      <rect x="18" y="56" width="34" height="24" rx="5"/><rect x="60" y="56" width="34" height="24" rx="5"/><rect x="102" y="56" width="34" height="24" rx="5"/><rect x="144" y="56" width="30" height="24" rx="5"/>
      <rect x="18" y="88" width="34" height="24" rx="5"/><rect x="60" y="88" width="34" height="24" rx="5"/><rect x="144" y="88" width="30" height="24" rx="5"/>
      <rect x="18" y="120" width="34" height="18" rx="5"/><rect x="60" y="120" width="34" height="18" rx="5"/><rect x="102" y="120" width="34" height="18" rx="5"/>
    </g>
    <rect x="102" y="88" width="34" height="24" rx="5" fill="#fbefe4" stroke="#9a4a12" stroke-width="2"/>
    <path d="M110 100 l6 6 l12 -12" fill="none" stroke="#9a4a12" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- small plant on ground -->
  <g transform="translate(80 0)">
  <rect x="660" y="560" width="54" height="40" rx="8" fill="#c9a77c"/>
  <path d="M687 560 C 680 530, 660 520, 650 522 C 660 540, 672 552, 687 560 Z M687 560 C 692 528, 712 516, 724 518 C 716 538, 702 552, 687 560 Z" fill="#2f8a74"/>
  </g>
</svg>
