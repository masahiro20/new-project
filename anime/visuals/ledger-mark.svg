<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-labelledby="t d">
  <title id="t">RED LEDGER — Ledger Mark emblem</title>
  <desc id="d">Series symbol: a hollow zero ring struck through by a ledger line, inside a double-ruled wristband ring with seven lender notches; red ink drips below.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#2A1418"/>
      <stop offset="0.6" stop-color="#160D12"/>
      <stop offset="1" stop-color="#0E0B10"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="arcTop" d="M 128 300 A 172 172 0 0 1 472 300"/>
    <path id="arcBot" d="M 104 300 A 196 196 0 0 0 496 300"/>
  </defs>

  <rect width="600" height="600" rx="36" fill="url(#bg)"/>
  <!-- faint ledger paper grid -->
  <g stroke="#E5172F" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 60H600M0 120H600M0 180H600M0 240H600M0 360H600M0 420H600M0 480H600M0 540H600"/>
  </g>
  <path d="M60 0V600M70 0V600" stroke="#E5172F" stroke-opacity="0.16" stroke-width="1.5"/>

  <!-- outer wristband: double ruled ring -->
  <g fill="none" stroke="#E5172F">
    <circle cx="300" cy="300" r="232" stroke-width="10"/>
    <circle cx="300" cy="300" r="214" stroke-width="3"/>
    <circle cx="300" cy="300" r="152" stroke-width="3" stroke-opacity="0.7"/>
  </g>

  <!-- ring text -->
  <g font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Helvetica Neue',Arial,sans-serif" font-weight="800" fill="#F5EEDD" letter-spacing="10">
    <text font-size="30" text-anchor="middle"><textPath href="#arcTop" startOffset="50%">RED LEDGER</textPath></text>
    <text font-size="22" text-anchor="middle" letter-spacing="14" fill="#E9E1CF"><textPath href="#arcBot" startOffset="50%">赤い帳簿 · NOT PAYING</textPath></text>
  </g>

  <!-- seven lender notches on the band (Iron, Flame, Eye, Speed, Voice, Abundance, Zero) -->
  <g stroke="#0E0B10" stroke-width="3">
    <circle cx="300" cy="68" r="11" fill="#E5172F"/>
    <circle cx="481.4" cy="155.4" r="9" fill="#9FB4C8"/>
    <circle cx="526.2" cy="351.6" r="9" fill="#FF7A1A"/>
    <circle cx="400.7" cy="509" r="9" fill="#A77BFF"/>
    <circle cx="199.3" cy="509" r="9" fill="#B8F03C"/>
    <circle cx="73.8" cy="351.6" r="9" fill="#3FA9F5"/>
    <circle cx="118.6" cy="155.4" r="9" fill="#FFD23F"/>
  </g>

  <!-- the zero: hollow ring with ink weight, slightly calligraphic -->
  <g filter="url(#glow)">
    <path fill="#E5172F" fill-rule="evenodd"
      d="M300 168 C 380 168 432 226 432 300 C 432 378 376 432 300 432 C 222 432 168 376 168 300 C 168 222 222 168 300 168 Z
         M300 214 C 254 214 222 252 224 302 C 226 350 256 388 302 386 C 348 384 378 348 376 298 C 374 250 344 214 300 214 Z"/>
    <!-- strike-through ledger line (the default) -->
    <path fill="#E5172F" d="M160 352 L 440 221 L 450 243 L 170 374 Z"/>
    <path fill="#0E0B10" d="M172 352 L 438 229 L 440 235 L 174 358 Z" opacity="0.85"/>
  </g>

  <!-- ink drips from the bottom of the zero -->
  <g fill="#E5172F">
    <path d="M262 424 C 262 436 260 446 264 452 C 270 460 284 458 284 448 C 284 440 282 434 284 428 Z"/>
    <path d="M318 430 C 317 436 318 440 321 444 C 325 448 334 447 334 441 C 334 437 333 434 334 428 Z"/>
    
  </g>
  <path d="M269 434 C 268 440 268 444 270 448" stroke="#FF6B7A" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- wet highlight on zero -->
  <path d="M220 250 C 236 214 268 194 304 190" stroke="#FF6B7A" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
</svg>
