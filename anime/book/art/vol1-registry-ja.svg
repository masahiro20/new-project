<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" xml:lang="ja" role="img" aria-labelledby="title desc">
<title id="title">バース中層登録所と仮登録</title>
<desc id="desc">締切の時刻盤と、ZEROが決済戦に登録されるまでの5つの段階：窓口、債務者の照会、保証人の照合、仮登録、第一決済戦の担保宣言で正式登録。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1A1C26"/></marker></defs><rect width="1240" height="760" fill="#F3F1E7"/><text x="60" y="64" font-family="'IBM Plex Mono', 'IPAGothic', ui-monospace, Menlo, monospace, sans-serif" font-size="16" fill="#C8102E" text-anchor="start" font-weight="600" letter-spacing="0.14em">FIG. 3 — BOURSE MID-TIER REGISTRY</text><text x="60" y="110" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="38" fill="#1A1C26" text-anchor="start">仮登録のしくみ</text><text x="60" y="146" font-family="'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="19" fill="#5A5F59" text-anchor="start">格付けのない者が決済戦に出るまで。保証人が同伴して、印を照合する。</text><path d="M60 166H1180" stroke="#1A1C26" stroke-width="2"/><path d="M60 172H1180" stroke="#1A1C26" stroke-width="1"/><rect x="60.0" y="210" width="196" height="300" rx="10" fill="#FBFAF4" stroke="#1A1C26" stroke-width="2.5"/><rect x="74.0" y="224" width="168" height="120" rx="6" fill="#E6E8DA"/><rect x="108.0" y="244" width="100" height="80" fill="#F5EEDD" stroke="#1A1C26" stroke-width="2.5"/><rect x="124.0" y="264" width="68" height="40" fill="#1B1F2E"/><path d="M124.0 264 h68 v14 h-68z" fill="#6B6B70"/><path d="M98.0 324 H218.0" stroke="#1A1C26" stroke-width="3"/><text x="78.0" y="376" font-family="'IBM Plex Mono', 'IPAGothic', ui-monospace, Menlo, monospace, sans-serif" font-size="13" fill="#C8102E" text-anchor="start" font-weight="600" letter-spacing="0.12em">STEP 1</text><text x="78.0" y="408" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="21" fill="#1A1C26" text-anchor="start">窓口へ</text><text x="78.0" y="442" font-family="'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="15" fill="#5A5F59" text-anchor="start">バース中層登録所。</text><text x="78.0" y="466" font-family="'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="15" fill="#5A5F59" text-anchor="start">受付は毎月の締切まで。</text><path d="M260.0 360.0 H285.0" stroke="#1A1C26" stroke-width="3" marker-end="url(#arr)"/><rect x="291.0" y="210" width="196" height="300" rx="10" fill="#FBFAF4" stroke="#1A1C26" stroke-width="2.5"/><rect x="305.0" y="224" width="168" height="120" rx="6" fill="#E6E8DA"/><rect x="325.0" y="248" width="128" height="72" rx="6" fill="#1A1C26"/><text x="389.0" y="278" font-family="'IBM Plex Mono', 'IPAGothic', ui-monospace, Menlo, monospace, sans-serif" font-size="22" fill="#F5EEDD" text-anchor="middle" font-weight="600">ERROR</text><text x="389.0" y="304" font-family="'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="14" fill="#E5172F" text-anchor="middle" font-weight="700">残高：計測不能</text><text x="309.0" y="376" font-family="'IBM Plex Mono', 'IPAGothic', ui-monospace, Menlo, monospace, sans-serif" font-size="13" fill="#C8102E" text-anchor="start" font-weight="600" letter-spacing="0.12em">STEP 2</text><text x="309.0" y="408" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="21" fill="#1A1C26" text-anchor="start">債務者の印を照会</text><text x="309.0" y="442" font-family="'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="15" fill="#5A5F59" text-anchor="start">ZEROの印は読めない。</text><text x="309.0" y="466" font-family="'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="15" fill="#5A5F59" text-anchor="start">照会機はエラーを出す。</text><path d="M491.0 360.0 H516.0" stroke="#1A1C26" stroke-width="3" marker-end="url(#arr)"/><rect x="522.0" y="210" width="196" height="300" rx="10" fill="#FBFAF4" stroke="#1A1C26" stroke-width="2.5"/><rect x="536.0" y="224" width="168" height="120" rx="6" fill="#E6E8DA"/><path d="M560.0 304 h50 v-24 h-50z" fill="#E5172F" stroke="#1A1C26" stroke-width="2"/><text x="585.0" y="298" font-family="'IBM Plex Mono', 'IPAGothic', ui-monospace, Menlo, monospace, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="600">−∞</text><path d="M630.0 304 h50 v-24 h-50z" fill="#F0921E" stroke="#1A1C26" stroke-width="2"/><text x="655.0" y="298" font-family="'IBM Plex Mono', 'IPAGothic', ui-monospace, Menlo, monospace, sans-serif" font-size="15" fill="#1A1C26" text-anchor="middle" font-weight="600">A</text><path d="M614.0 292 h12" stroke="#1A1C26" stroke-width="3"/><text x="620.0" y="250" font-family="'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="13" fill="#5A5F59" text-anchor="middle">担保拠出：承認</text><text x="540.0" y="376" font-family="'IBM Plex Mono', 'IPAGothic', ui-monospace, Menlo, monospace, sans-serif" font-size="13" fill="#C8102E" text-anchor="start" font-weight="600" letter-spacing="0.12em">STEP 3</text><text x="540.0" y="408" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="21" fill="#1A1C26" text-anchor="start">保証人の印を照合</text><text x="540.0" y="442" font-family="'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="15" fill="#5A5F59" text-anchor="start">格付けAの保証人が</text><text x="540.0" y="466" font-family="'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="15" fill="#5A5F59" text-anchor="start">担保を出して承認。</text><path d="M722.0 360.0 H747.0" stroke="#1A1C26" stroke-width="3" marker-end="url(#arr)"/><rect x="753.0" y="210" width="196" height="300" rx="10" fill="#FBFAF4" stroke="#1A1C26" stroke-width="2.5"/><rect x="767.0" y="224" width="168" height="120" rx="6" fill="#E6E8DA"/><rect x="781.0" y="240" width="140" height="88" fill="#0E0B10" stroke="#C9A24A" stroke-width="4"/><rect x="793.0" y="252" width="90" height="6" fill="#5C5466"/><rect x="793.0" y="265" width="82" height="6" fill="#5C5466"/><rect x="793.0" y="278" width="74" height="6" fill="#5C5466"/><rect x="793.0" y="291" width="66" height="6" fill="#5C5466"/><text x="851.0" y="318" font-family="'IBM Plex Mono', 'IPAGothic', ui-monospace, Menlo, monospace, sans-serif" font-size="11" fill="#E5172F" text-anchor="middle" font-weight="600">AKABA JIN／ZERO（仮）</text><text x="771.0" y="376" font-family="'IBM Plex Mono', 'IPAGothic', ui-monospace, Menlo, monospace, sans-serif" font-size="13" fill="#C8102E" text-anchor="start" font-weight="600" letter-spacing="0.12em">STEP 4</text><text x="771.0" y="408" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="21" fill="#1A1C26" text-anchor="start">仮登録</text><text x="771.0" y="442" font-family="'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="15" fill="#5A5F59" text-anchor="start">格付け盤の最下段に</text><text x="771.0" y="466" font-family="'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="15" fill="#5A5F59" text-anchor="start">名前が載る。</text><path d="M953.0 360.0 H978.0" stroke="#1A1C26" stroke-width="3" marker-end="url(#arr)"/><rect x="984.0" y="210" width="196" height="300" rx="10" fill="#FBFAF4" stroke="#1A1C26" stroke-width="2.5" stroke-dasharray="8 6"/><rect x="998.0" y="224" width="168" height="120" rx="6" fill="#E6E8DA"/><circle cx="1082.0" cy="284" r="42" fill="none" stroke="#5A5F59" stroke-width="4" stroke-dasharray="6 5"/><text x="1082.0" y="294" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="17" fill="#5A5F59" text-anchor="middle">担保宣言</text><text x="1002.0" y="376" font-family="'IBM Plex Mono', 'IPAGothic', ui-monospace, Menlo, monospace, sans-serif" font-size="13" fill="#C8102E" text-anchor="start" font-weight="600" letter-spacing="0.12em">STEP 5</text><text x="1002.0" y="408" font-family="'Dela Gothic One', 'Z