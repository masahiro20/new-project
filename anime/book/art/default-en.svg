<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1100" width="1240" height="1100" xml:lang="en" role="img" aria-labelledby="title desc">
<title id="title">How DEFAULT works</title>
<desc id="desc">Five-step diagram: 1 touch with the red left hand; 2 the target’s mark turns white and a 00:03 counter starts; 3 Jin uses the seized power for 3 seconds; 4 the use is entered in Hazama’s ledger; 5 Jin pays one memory.</desc>
<defs>
<g id="hand"><!-- Jin's left hand, pointing right; wrist at 0,0 -->
<path d="M-90 -20H0V20H-90Z" fill="#E5172F" stroke="#1A1C26" stroke-width="2.5"/>
<path d="M-78 -20V20M-70 -20V20M-48 -20V20M-40 -20V20M-18 -20V20M-10 -20V20" stroke="#7A0614" stroke-width="2.5"/>
<path d="M0 -22C14 -26 34 -26 46 -22L86 -24C94 -24 94 -14 86 -13L54 -12L90 -8C98 -7 98 3 90 3L54 2L86 8C93 9 92 18 85 18L52 15L74 22C80 24 77 32 70 31L40 26C24 28 8 26 0 22Z" fill="#E2B48E" stroke="#1A1C26" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M14 -22C20 -34 34 -40 44 -36C50 -33 46 -26 40 -26" fill="#E2B48E" stroke="#1A1C26" stroke-width="2.5" stroke-linejoin="round"/>
</g>
<clipPath id="pclip"><rect width="300" height="150" rx="10"/></clipPath>
<pattern id="pdots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#BFC9B3"/></pattern>
</defs><rect width="1240" height="1100" fill="#F3F1E7"/><text x="60" y="70" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace, sans-serif" font-size="16" fill="#C8102E" font-weight="600" letter-spacing="0.14em">JIN'S POWER — 3-SECOND REPOSSESSION</text><text x="60" y="118" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="40" fill="#1A1C26">How DEFAULT Works</text><text x="60" y="154" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="20" fill="#5A5F59">Touch a borrower, seize their borrowed power for ~3 seconds, and use it yourself.</text><path d="M60 176H1180" stroke="#1A1C26" stroke-width="2"/><path d="M60 182H1180" stroke="#1A1C26" stroke-width="1"/><path d="M96 279V951" stroke="#1A1C26" stroke-width="2" stroke-dasharray="2 6"/><circle cx="96" cy="279" r="28" fill="#C8102E" stroke="#1A1C26" stroke-width="2.5"/><text x="96" y="291" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="30" fill="#FFFFFF" text-anchor="middle">1</text><g transform="translate(150 204)"><g clip-path="url(#pclip)"><rect width="300" height="150" rx="10" fill="#E6E8DA" stroke="#1A1C26" stroke-width="2"/><rect width="300" height="150" rx="10" fill="url(#pdots)"/><path d="M300 52H176C168 52 160 60 160 75C160 90 168 98 176 98H300Z" fill="#DCC3AC" stroke="#1A1C26" stroke-width="2.5"/><rect x="210" y="51" width="44" height="48" rx="6" fill="#9AA3AD" stroke="#1A1C26" stroke-width="2.5"/><path d="M210 69H254M210 79H254" stroke="#1A1C26" stroke-width="2" opacity="0.6"/><use href="#hand" transform="translate(70 76)"/><g stroke="#E5172F" stroke-width="4" stroke-linecap="round"><path d="M160 52L150 34M168 50L176 30M160 100L148 118M168 100L178 120"/></g><circle cx="151" cy="40" r="4" fill="#E5172F"/><circle cx="182" cy="122" r="3" fill="#E5172F"/></g><rect width="300" height="150" rx="10" fill="none" stroke="#1A1C26" stroke-width="2.5"/></g><text x="490" y="234" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace, sans-serif" font-size="14" fill="#5A5F59" letter-spacing="0.14em">STEP 01 — TOUCH</text><text x="490" y="270" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="26" fill="#1A1C26">Touch</text><text x="490" y="306" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="18" fill="#1A1C26">Jin touches the target — or anything made with their borrowed</text><text x="490" y="336" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="18" fill="#1A1C26">power — bare-handed, with his red-marked left hand.</text><path d="M490 366H1100" stroke="#BFC9B3" stroke-width="1.5"/><circle cx="96" cy="447" r="28" fill="#F3F1E7" stroke="#1A1C26" stroke-width="2.5"/><text x="96" y="459" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="30" fill="#1A1C26" text-anchor="middle">2</text><g transform="translate(150 372)"><g clip-path="url(#pclip)"><rect width="300" height="150" rx="10" fill="#E6E8DA" stroke="#1A1C26" stroke-width="2"/><rect width="300" height="150" rx="10" fill="url(#pdots)"/><path d="M0 50H150V110H0Z" fill="#DCC3AC" stroke="#1A1C26" stroke-width="2.5"/><rect x="40" y="40" width="80" height="80" rx="8" fill="#FFFFFF" stroke="#1A1C26" stroke-width="2.5"/><path d="M40 62H120M40 70H120" stroke="#9AA3AD" stroke-width="2" stroke-dasharray="4 4"/><text x="80" y="98" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace, sans-serif" font-size="20" fill="#5A5F59" text-anchor="middle" font-weight="600">1,240</text><path d="M44 92L116 88" stroke="#E5172F" stroke-width="5" stroke-linecap="round"/><rect x="160" y="44" width="122" height="62" rx="6" fill="#1A1C26"/><text x="221" y="88" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace, sans-serif" font-size="30" fill="#E5172F" text-anchor="middle" font-weight="600">00:03</text><text x="221" y="128" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace, sans-serif" font-size="11" fill="#1A1C26" text-anchor="middle" letter-spacing="0.08em">CONTRACT SUSPENDED</text></g><rect width="300" height="150" rx="10" fill="none" stroke="#1A1C26" stroke-width="2.5"/></g><text x="490" y="402" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace, sans-serif" font-size="14" fill="#5A5F59" letter-spacing="0.14em">STEP 02 — SEIZE</text><text x="490" y="438" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="26" fill="#1A1C26">The target’s mark goes white</text><text x="490" y="474" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="18" fill="#1A1C26">Color drains from their mark and a red line strikes through</text><text x="490" y="504" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="18" fill="#1A1C26">the balance. The counter starts: 00:03.</text><path d="M490 534H1100" stroke="#BFC9B3" stroke-width="1.5"/><circle cx="96" cy="615" r="28" fill="#F3F1E7" stroke="#1A1C26" stroke-width="2.5"/><text x="96" y="627" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="30" fill="#1A1C26" text-anchor="middle">3</text><g transform="translate(150 540)"><g clip-path="url(#pclip)"><rect width="300" height="150" rx="10" fill="#E6E8DA" stroke="#1A1C26" stroke-width="2"/><rect width="300" height="150" rx="10" fill="url(#pdots)"/><rect x="118" y="62" width="34" height="24" rx="12" fill="none" stroke="#8C949C" stroke-width="7"/><rect x="148" y="66" width="34" height="16" rx="8" fill="none" stroke="#8C949C" stroke-width="7"/><rect x="178" y="62" width="34" height="24" rx="12" fill="none" stroke="#8C949C" stroke-width="7"/><rect x="208" y="66" width="34" height="16" rx="8" fill="none" stroke="#8C949C" stroke-width="7"/><rect x="238" y="62" width="34" height="24" rx="12" fill="none" stroke="#8C949C" stroke-width="7"/><rect x="268" y="66" width="34" height="16" rx="8" fill="none" stroke="#8C949C" stroke-width="7"/><use href="#hand" transform="translate(110 76)"/><path d="M20 74H108" stroke="#8C949C" stroke-width="4"/><path d="M120 116H40M52 106L40 116L52 126" fill="none" stroke="#1A1C26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="200" y="18" width="22" height="10" rx="2" fill="#E5172F" opacity="1"/><rect x="228" y="18" width="22" height="10" rx="2" fill="#E5172F" opacity="0.7"/><rect x="256" y="18" width="22" height="10" rx="2" fill="#E5172F" opacity="0.4"/></g><rect width="300" height="150" rx="10" fill="none" stroke="#1A1C26" stroke-width="2.5"/></g><text x="490" y="570" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace, sans-serif" font-size="14" fill="#5A5F59" letter-spacing="0.14em">STEP 03 — USE</text><text x="490" y="606" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="26" fill="#1A1C26">Use the seized power for 3 s</text><text x="490" y="642" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="18" fill="#1A1C26">The target’s power stops and Jin wields it himself.</text><text x="490" y="672" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="18" fill="#1A1C26">(Ep. 1: he takes Nil’s chain and reels him in.)</text><path d="M490 702H1100" stroke="#BFC9B3" stroke-width="1.5"/><circle cx="96" cy="783" r="28" fill="#F3F1E7" stroke="#1A1C26" stroke-width="2.5"/><text x="96" y="795" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="30" fill="#1A1C26" text-anchor="middle">4</text><g transform="translate(150 708)"><g clip-path="url(#pclip)"><rect width="300" height="150" rx="10" fill="#E6E8DA" stroke="#1A1C26" stroke-width="2"/><rect width="300" height="150" rx="10" fill="url(#pdots)"/><path d="M40 40L148 30V128L40 136Z" fill="#E9E1CF" stroke="#1A1C26" stroke-width="2.5"/><path d="M148 30L256 40V136L148 128Z" fill="#F7F2E4" stroke="#1A1C26" stroke-width="2.5"/><path d="M52 52L138 45M158 45L246 52M52 65L138 58M158 58L246 65M52 78L138 71M158 71L246 78M52 91L138 84M158 84L246 91M52 104L138 97M158 97L246 104M52 117L138 110M158 110L246 117" stroke="#BFC9B3" stroke-width="2"/><path d="M164 99L232 104" stroke="#E5172F" stroke-width="5" stroke-linecap="round"/><path d="M164 112L210 115" stroke="#E5172F" stroke-width="3" stroke-linecap="round"/><path d="M62 60L120 55M62 73L108 69M62 86L124 81" stroke="#1A1C26" stroke-width="2.5" opacity="0.55"/><path d="M250 70L268 50L276 58L258 78Z" fill="#1A1C26"/><path d="M236 98L250 70L258 78Z" fill="#E5172F" stroke="#1A1C26" stroke-width="1.5"/><circle cx="226" cy="112" r="4" fill="#E5172F"/></g><rect width="300" height="150" rx="10" fill="none" stroke="#1A1C26" stroke-width="2.5"/></g><text x="490" y="738" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace, sans-serif" font-size="14" fill="#5A5F59" letter-spacing="0.14em">STEP 04 — RECORD</text><text x="490" y="774" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="26" fill="#1A1C26">Entry in Hazama’s ledger</text><text x="490" y="810" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="18" fill="#1A1C26">Nothing is erased: every use is written into</text><text x="490" y="840" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="18" fill="#1A1C26">Hazama’s ledger as Jin’s own debt.</text><path d="M490 870H1100" stroke="#BFC9B3" stroke-width="1.5"/><circle cx="96" cy="951" r="28" fill="#F3F1E7" stroke="#1A1C26" stroke-width="2.5"/><text x="96" y="963" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="30" fill="#1A1C26" text-anchor="middle">5</text><g transform="translate(150 876)"><g clip-path="url(#pclip)"><rect width="300" height="150" rx="10" fill="#E6E8DA" stroke="#1A1C26" stroke-width="2"/><rect width="300" height="150" rx="10" fill="url(#pdots)"/><g transform="rotate(-4 90 76)"><rect x="34" y="22" width="110" height="112" fill="#FFFFFF" stroke="#1A1C26" stroke-width="2.5"/><rect x="44" y="32" width="90" height="78" fill="#C8BFAE"/><circle cx="89" cy="62" r="18" fill="#8C8374"/><path d="M60 110C62 88 76 82 89 82C102 82 116 88 118 110Z" fill="#8C8374"/><rect x="72" y="46" width="36" height="34" fill="#FFFFFF"/></g><rect x="160" y="40" width="14" height="14" fill="#FFFFFF" stroke="#1A1C26" stroke-width="1.5" transform="rotate(12 160 40)"/><rect x="182" y="64" width="11" height="11" fill="#FFFFFF" stroke="#1A1C26" stroke-width="1.5" transform="rotate(12 182 64)"/><rect x="200" y="36" width="9" height="9" fill="#FFFFFF" stroke="#1A1C26" stroke-width="1.5" transform="rotate(12 200 36)"/><rect x="216" y="78" width="8" height="8" fill="#FFFFFF" stroke="#1A1C26" stroke-width="1.5" transform="rotate(12 216 78)"/><rect x="234" y="54" width="7" height="7" fill="#FFFFFF" stroke="#1A1C26" stroke-width="1.5" transform="rotate(12 234 54)"/><rect x="250" y="88" width="6" height="6" fill="#FFFFFF" stroke="#1A1C26" stroke-width="1.5" transform="rotate(12 250 88)"/><rect x="262" y="66" width="5" height="5" fill="#FFFFFF" stroke="#1A1C26" stroke-width="1.5" transform="rotate(12 262 66)"/><path d="M160 120H268M256 110L268 120L256 130" fill="none" stroke="#E5172F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><rect width="300" height="150" rx="10" fill="none" stroke="#1A1C26" stroke-width="2.5"/></g><text x="490" y="906" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace, sans-serif" font-size="14" fill="#5A5F59" letter-spacing="0.14em">STEP 05 — PAY</text><text x="490" y="942" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="26" fill="#1A1C26">Pay one memory</text><text x="490" y="978" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="18" fill="#1A1C26">The price is one of Jin’s memories. The bigger the power</text><text x="490" y="1008" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="18" fill="#1A1C26">he seizes, the more precious the memory taken.</text><path d="M1126 382H1140V692H1126" fill="none" stroke="#C8102E" stroke-width="3"/><g transform="translate(1166 537) rotate(90)"><text x="0" y="0" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace, sans-serif" font-size="18" fill="#C8102E" text-anchor="middle" font-weight="700">00:03 — seized</text></g><rect x="60" y="1052" width="1120" height="1" fill="#BFC9B3"/><text x="60" y="1080" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="16" fill="#5A5F59">* No effect on power that isn’t borrowed (trained muscle, plain blades). Same target again: wait ~10 seconds.</text>
</svg>
