<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1100" width="1240" height="1100" xml:lang="ja" role="img" aria-labelledby="title desc">
<title id="title">設定画：ツバメ（裏道屋）</title>
<desc id="desc">ツバメの全身の設定画（正面）。ゴーグルで押さえた茶色の短髪、緑の目、すきっ歯、ぶかぶかのパーカー、サンダル、左手首の翠の印。小物として、裏に昇降骨の断面を描いた丼のふた。</desc>
