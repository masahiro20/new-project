<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1500" width="1240" height="1500" xml:lang="ja" role="img" aria-labelledby="title desc">
<title id="title">昇降骨 断面図</title>
<desc id="desc">昇降骨の縦の断面。中央に籠の縦坑、そのまわりを蛇行する古い穴「髄の道」が縦坑と三回交差する。下に底帳口、上に中層の骨の出口テラス。ジンとミオの経路、ニルの位置、〈デフォルト〉を使った2か所を示す。</desc>
<defs>
<pattern id="cortex" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0 9 Q4.5 5 9 9 T18 9" fill="none" stroke="#D3C9B2" stroke-width="1.2"/></pattern>
<pattern id="dark" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#2C3038"/><path d="M0 12 L12 0" stroke="#3A3F4A" stroke-width="2"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1A1C26"/></marker>
</defs>
<rect width="1240" height="1500" fill="#F3F1E7"/>
<text x="60" y="64" font-family="'IBM Plex Mono', 'IPAGothic', ui-monospace, Menlo, monospace, sans-serif" font-size="16" fill="#C8102E" text-anchor="start" font-weight="600" letter-spacing="0.14em">FIG. 1 — BONE LIFT / CROSS-SECTION</text><text x="60" y="110" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="38" fill="#1A1C26" text-anchor="start">昇降骨 断面図</text><text x="60" y="146" font-family="'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="19" fill="#5A5F59" text-anchor="start">第2話でジンとミオが登った経路。縮尺は目安。</text><path d="M60 166H1180" stroke="#1A1C26" stroke-width="2"/><path d="M60 172H1180" stroke="#1A1C26" stroke-width="1"/><path d="M180 230 C130 430 160 650 140 850 C120 1050 150 1230 130 1400 L630 1400 C610 1230 640 1050 620 850 C600 650 630 430 580 230 Z" fill="#E9E1CF" stroke="#1A1C26" stroke-width="3"/><path d="M180 230 C130 430 160 650 140 850 C120 1050 150 1230 130 1400 L630 1400 C610 1230 640 1050 620 850 C600 650 630 430 580 230 Z" fill="url(#cortex)" opacity="0.8"/><path d="M190 260 C160 530 190 850 172 1386 L588 1386 C570 850 600 530 570 260 Z" fill="#DCD2BC" stroke="#A89F8A" stroke-width="2"/><rect x="340" y="220" width="80" height="1180" fill="url(#dark)" stroke="#1A1C26" stroke-width="2.5"/><line x1="358" y1="220" x2="358" y2="1400" stroke="#8C949C" stroke-width="2"/><line x1="402" y1="220" x2="402" y2="1400" stroke="#8C949C" stroke-width="2"/><path d="M190 1370 C190 1290 230 1250 300 1215 L470 1150 C560 1115 575 1060 570 990 C565 930 540 890 470 860 L300 800 C200 765 185 700 190 640 C195 580 230 545 300 520 L470 470 C560 440 580 400 580 340 C580 290 570 250 560 215" fill="none" stroke="#7A705C" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/><path d="M190 1370 C190 1290 230 1250 300 1215 L470 1150 C560 1115 575 1060 570 990 C565 930 540 890 470 860 L300 800 C200 765 185 700 190 640 C195 580 230 545 300 520 L470 470 C560 440 580 400 580 340 C580 290 570 250 560 215" fill="none" stroke="#C9BEA5" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/><path d="M190 1370 C190 1290 230 1250 300 1215 L470 1150 C560 1115 575 1060 570 990 C565 930 540 890 470 860 L300 800 C200 765 185 700 190 640 C195 580 230 545 300 520 L470 470 C560 440 580 400 580 340 C580 290 570 250 560 215" fill="none" stroke="#8A7F6A" stroke-width="50" stroke-dasharray="4 26" stroke-linejoin="round"/><rect x="340" y="1148" width="80" height="68" fill="#2C3038" opacity="0.28"/><rect x="340" y="796" width="80" height="68" fill="#2C3038" opacity="0.28"/><rect x="340" y="461" width="80" height="68" fill="#2C3038" opacity="0.28"/><path d="M190 1370 C190 1290 230 1250 300 1215 L470 1150 C560 1115 575 1060 570 990 C565 930 540 890 470 860 L300 800 C200 765 185 700 190 640 C195 580 230 545 300 520 L470 470 C560 440 580 400 580 340 C580 290 570 250 560 215" fill="none" stroke="#E5172F" stroke-width="5" stroke-dasharray="3 11" stroke-linecap="round"/><path d="M520 205 L600 205" stroke="#1A1C26" stroke-width="6"/><path d="M528 196V214M544 196V214M560 196V214M576 196V214M592 196V214" stroke="#1A1C26" stroke-width="3"/><path d="M560 205 L700 205 L700 222 L560 222 Z" fill="#8A4B32" stroke="#1A1C26" stroke-width="2"/><path d="M640 205 L640 160 M680 205 L680 160 M630 160 L690 160" stroke="#1A1C26" stroke-width="2"/><path d="M600 150 L760 120 L760 200 Z" fill="#F2B65A" opacity="0.25"/><rect x="300" y="1400" width="160" height="34" fill="#3E5A5C" stroke="#1A1C26" stroke-width="2"/><path d="M318 1434V1406 M340 1434V1406 M420 1434V1406 M442 1434V1406" stroke="#E9E1CF" stroke-width="3"/><rect x="364" y="1408" width="32" height="20" rx="3" fill="#1A1C26"/><rect x="370" y="1412" width="20" height="8" fill="#E5172F"/><line x1="80" y1="1434" x2="700" y2="1434" stroke="#1A1C26" stroke-width="3"/><rect x="348" y="420" width="64" height="58" fill="#6B6B70" stroke="#1A1C26" stroke-width="2.5"/><path d="M348 434H412M370 420V478M390 420V478" stroke="#1A1C26" stroke-width="2"/><line x1="380" y1="220" x2="380" y2="420" stroke="#8C949C" stroke-width="3"/><path d="M380 490 L380 524" stroke="#1A1C26" stroke-width="3" marker-end="url(#arr)"/><rect x="348" y="1060" width="64" height="58" fill="#6B6B70" stroke="#1A1C26" stroke-width="2.5"/><path d="M348 1074H412M370 1060V1118M390 1060V1118" stroke="#1A1C26" stroke-width="2"/><path d="M380 1052 L380 1020" stroke="#1A1C26" stroke-width="3" marker-end="url(#arr)"/><g transform="translate(432 815) rotate(-90)"><path d="M-8 0 L8 0 L12 -60 L-12 -60 Z" fill="#15161A"/><rect x="-9" y="-80" width="18" height="22" fill="#E6DCC6" stroke="#1A1C26" stroke-width="2"/><line x1="-6" y1="-71" x2="6" y2="-71" stroke="#1A1C26" stroke-width="2"/><rect x="-14" y="-88" width="28" height="6" fill="#15161A"/><rect x="-8" y="-100" width="16" height="12" fill="#15161A"/></g><path d="M436 807.0 Q492 775 542 751.0" fill="none" stroke="#8C949C" stroke-width="3" stroke-dasharray="7 4"/><path d="M436 815.0 Q492 815 542 815.0" fill="none" stroke="#8C949C" stroke-width="3" stroke-dasharray="7 4"/><path d="M436 823.0 Q492 855 542 879.0" fill="none" stroke="#8C949C" stroke-width="3" stroke-dasharray="7 4"/><circle cx="300" cy="1182" r="20" fill="#F3F1E7" stroke="#1A1C26" stroke-width="3"/><text x="300" y="1189" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="20" fill="#1A1C26" text-anchor="middle">1</text><circle cx="300" cy="830" r="20" fill="#F3F1E7" stroke="#1A1C26" stroke-width="3"/><text x="300" y="837" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="20" fill="#1A1C26" text-anchor="middle">2</text><circle cx="300" cy="495" r="20" fill="#F3F1E7" stroke="#1A1C26" stroke-width="3"/><text x="300" y="502" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="20" fill="#1A1C26" text-anchor="middle">3</text><polygon points="249.0,660.0 231.6,666.9 239.0,684.0 221.9,676.6 215.0,694.0 208.1,676.6 191.0,684.0 198.4,666.9 181.0,660.0 198.4,653.1 191.0,636.0 208.1,643.4 215.0,626.0 221.9,643.4 239.0,636.0 231.6,653.1" fill="#E5172F" stroke="#1A1C26" stroke-width="2"/><text x="215" y="667" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">①</text><polygon points="514.0,480.0 496.6,486.9 504.0,504.0 486.9,496.6 480.0,514.0 473.1,496.6 456.0,504.0 463.4,486.9 446.0,480.0 463.4,473.1 456.0,456.0 473.1,463.4 480.0,446.0 486.9,463.4 504.0,456.0 496.6,473.1" fill="#E5172F" stroke="#1A1C26" stroke-width="2"/><text x="480" y="487" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">②</text><path d="M700 205 L750 250 H770" fill="none" stroke="#1A1C26" stroke-width="1.5"/><circle cx="700" cy="205" r="5" fill="#1A1C26"/><text x="790" y="224" font-family="'IBM Plex Mono', 'IPAGothic', ui-monospace, Menlo, monospace, sans-serif" font-size="14" fill="#C8102E" text-anchor="start" font-weight="600" letter-spacing="0.1em">06 / EXIT</text><text x="790" y="254" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="24" fill="#1A1C26" text-anchor="start">中層口・骨の出口テラス</text><text x="790" y="284" font-family="'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="16" fill="#5A5F59" text-anchor="start">髄の道の終わりの格子を、内側から蹴り外す。</text><path d="M515 480 L750 440 H770" fill="none" stroke="#1A1C26" stroke-width="1.5"/><circle cx="515" cy="480" r="5" fill="#1A1C26"/><text x="790" y="414" font-family="'IBM Plex Mono', 'IPAGothic', ui-monospace, Menlo, monospace, sans-serif" font-size="14" fill="#C8102E" text-anchor="start" font-weight="600" letter-spacing="0.1em">05 / CROSSING 3</text><text x="790" y="444" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="24" fill="#1A1C26" text-anchor="start">第三交差</text><text x="790" y="474" font-family="'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="16" fill="#5A5F59" text-anchor="start">籠が下りてくる。網の上で〈デフォルト〉2回目②。</text><path d="M250 660 L750 640 H770" fill="none" stroke="#1A1C26" stroke-width="1.5"/><circle cx="250" cy="660" r="5" fill="#1A1C26"/><text x="790" y="614" font-family="'IBM Plex Mono', 'IPAGothic', ui-monospace, Menlo, monospace, sans-serif" font-size="14" fill="#C8102E" text-anchor="start" font-weight="600" letter-spacing="0.1em">04 / SHAFT</text><text x="790" y="644" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="24" fill="#1A1C26" text-anchor="start">第二〜第三交差のあいだ</text><text x="790" y="674" font-family="'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="16" fill="#5A5F59" text-anchor="start">鎖がミオの足首に。ジンが素手で鎖を握る①。</text><path d="M545 815 L750 830 H770" fill="none" stroke="#1A1C26" stroke-width="1.5"/><circle cx="545" cy="815" r="5" fill="#1A1C26"/><text x="790" y="804" font-family="'IBM Plex Mono', 'IPAGothic', ui-monospace, Menlo, monospace, sans-serif" font-size="14" fill="#C8102E" text-anchor="start" font-weight="600" letter-spacing="0.1em">03 / CROSSING 2</text><text x="790" y="834" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="24" fill="#1A1C26" text-anchor="start">第二交差</text><text x="790" y="864" font-family="'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="16" fill="#5A5F59" text-anchor="start">ニルが縦坑の壁に“横向きに”立って待つ。</text><path d="M420 1000 L750 1010 H770" fill="none" stroke="#1A1C26" stroke-width="1.5"/><circle cx="420" cy="1000" r="5" fill="#1A1C26"/><text x="790" y="984" font-family="'IBM Plex Mono', 'IPAGothic', ui-monospace, Menlo, monospace, sans-serif" font-size="14" fill="#C8102E" text-anchor="start" font-weight="600" letter-spacing="0.1em">02 / LIFT CAGE</text><text x="790" y="1014" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="24" fill="#1A1C26" text-anchor="start">籠の縦坑</text><text x="790" y="1044" font-family="'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="16" fill="#5A5F59" text-anchor="start">格付けを照会して乗る鉄の籠。上り・下りがある。</text><path d="M470 1182 L750 1180 H770" fill="none" stroke="#1A1C26" stroke-width="1.5"/><circle cx="470" cy="1182" r="5" fill="#1A1C26"/><text x="790" y="1154" font-family="'IBM Plex Mono', 'IPAGothic', ui-monospace, Menlo, monospace, sans-serif" font-size="14" fill="#C8102E" text-anchor="start" font-weight="600" letter-spacing="0.1em">01 / CROSSING 1</text><text x="790" y="1184" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="24" fill="#1A1C26" text-anchor="start">第一交差</text><text x="790" y="1214" font-family="'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="16" fill="#5A5F59" text-anchor="start">籠の通過まで41秒。輪をはしごに登る。</text><path d="M460 1417 L750 1330 H770" fill="none" stroke="#1A1C26" stroke-width="1.5"/><circle cx="460" cy="1417" r="5" fill="#1A1C26"/><text x="790" y="1304" font-family="'IBM Plex Mono', 'IPAGothic', ui-monospace, Menlo, monospace, sans-serif" font-size="14" fill="#C8102E" text-anchor="start" font-weight="600" letter-spacing="0.1em">00 / ENTRANCE</text><text x="790" y="1334" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="24" fill="#1A1C26" text-anchor="start">底帳口</text><text x="790" y="1364" font-family="'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="16" fill="#5A5F59" text-anchor="start">改札の照会機。ZEROは乗骨不可。</text><line x1="790" y1="1414" x2="840" y2="1414" stroke="#E5172F" stroke-width="5" stroke-dasharray="3 11" stroke-linecap="round"/><text x="852" y="1420" font-family="'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="16" fill="#1A1C26" text-anchor="start">ジンとミオの経路</text><rect x="1010" y="1396" width="26" height="26" fill="#C9BEA5" stroke="#7A705C" stroke-width="3"/><text x="1046" y="1420" font-family="'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="16" fill="#1A1C26" text-anchor="start">髄の道</text><text x="60" y="1470" font-family="'Zen Kaku Gothic New', 'IPAGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="15" fill="#5A5F59" text-anchor="start">※第2話の時点の図。髄の道は、ツバメが丼のふたの裏に描いた地図をもとにしている。</text></svg>
