    <path d="M188,520 L220,520 M180,532 L206,532" stroke-width="1.6" opacity="0.5"/>
    <path d="M392,610 L428,610 M398,622 L420,622" stroke-width="1.6" opacity="0.5"/>
    <path d="M206,760 L238,760 M370,790 L404,790 M380,802 L398,802" stroke-width="1.6" opacity="0.45"/>
    <path d="M226,860 L254,860 M346,880 L372,880" stroke-width="1.4" opacity="0.35"/>
