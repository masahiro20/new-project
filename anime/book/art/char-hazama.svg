    <path d="M278,720 L280,840 M312,720 L312,840" stroke="#FF6B7A" stroke-width="2" fill="none"/>
    <path d="M282,894 C280,906 284,914 288,902" fill="#E5172F" stroke-width="2"/>
    <path d="M314,894 C314,910 320,918 322,902" fill="#E5172F" stroke-width="2"/>

    <!-- oversized shirt -->
    <path d="M250,494 C276,484 324,484 350,494 L372,516 C378,580 384,650 386,716 C376,722 366,712 358,724 C350,746 340,722 330,738 C320,754 310,730 300,742 C290,756 280,730 270,742 C260,756 250,728 242,724 C234,712 222,722 214,716 C216,650 222,580 228,516 Z" fill="#E5172F"/>
    <path d="M336,492 L350,494 L372,516 C378,580 384,650 386,716 C376,722 366,712 358,724 C356,640 352,560 336,492 Z" fill="#B0101F" stroke="none"/>
    <path d="M240,540 C236,600 232,660 230,706" fill="none" stroke="#FF6B7A" stroke-width="4"/>
    <path d="M276,560 Q300,572 322,560 M262,640 Q300,656 340,640" fill="none" stroke="#B0101F" stroke-width="2.5"/>
    <!-- hem drips -->
    <path d="M270,742 C268,760 272,772 276,760 L274,744 Z M330,738 C330,758 336,766 338,752 Z M242,724 C240,744 246,750 248,736 Z" fill="#E5172F" stroke-width="2"/>
    <!-- collar -->
    <path d="M272,490 Q300,510 328,490" fill="none" stroke-width="3"/>

    <!-- right sleeve (viewer left) -->
    <path d="M252,494 C232,500 222,530 218,570 L204,660 L242,666 L248,580 L256,520 Z" fill="#E5172F"/>
    <path d="M226,560 C220,600 214,630 210,656" fill="none" stroke="#FF6B7A" stroke-width="3"/>
    <circle cx="222" cy="680" r="15" fill="#E5172F"/>
    <path d="M216,694 C214,708 220,716 224,706" fill="#E5172F" stroke-width="2"/>

    <!-- left sleeve (viewer right) + ink thread -->
    <path d="M348,494 C368,500 378,530 382,570 L396,660 L358,666 L352,580 L344,520 Z" fill="#B0101F"/>
    <path d="M362,520 C372,560 380,610 388,656 L396,660 L382,570 C378,530 368,500 348,494 Z" fill="#8E0A1A" stroke="none"/>
    <!-- glowing wrist mark -->
    <ellipse cx="378" cy="670" rx="26" ry="12" fill="#FF6B7A" opacity="0.8" filter="url(#blur)" stroke="none"/>
    <circle cx="378" cy="682" r="15" fill="#E5172F"/>
    <path d="M362,668 C372,674 386,674 396,668 M362,674 C372,680 386,680 396,674" fill="none" stroke="#FFD0D6" stroke-width="2"/>
    <!-- thread of ink leading out of frame (to Jin's wrist) -->
    <path d="M392,676 C440,690 452,640 492,650 C530,660 540,610 572,616 C590,620 598,600 604,596" fill="none" stroke="#E5172F" stroke-width="2.5"/>
    <path d="M392,676 C440,690 452,640 492,650 C530,660 540,610 572,616 C590,620 598,600 604,596" fill="none" stroke="#E5172F" stroke-width="8" opacity="0.4" filter="url(#soft)"/>

    <!-- head -->
    <path d="M232,412 C230,352 262,332 300,332 C338,332 370,352 368,412 C368,462 340,490 300,490 C260,490 232,462 232,412 Z" fill="#E5172F"/>
    <path d="M340,346 C362,366 368,400 364,436 C360,466 340,486 312,490 C342,470 356,440 354,404 C352,380 348,360 340,346 Z" fill="#B0101F" stroke="none"/>
    <!-- ink hair tufts -->
    <path d="M236,392 C232,350 262,322 300,322 C338,322 368,350 364,392 L352,366 L344,380 L330,350 L318,372 L300,344 L284,370 L270,352 L256,382 L248,366 Z" fill="#C4101F"/>
    <path d="M272,338 C288,330 312,330 328,338" fill="none" stroke="#FF6B7A" stroke-width="3"/>
    <path d="M244,392 C242,410 246,420 250,412 Z M356,392 C358,414 352,420 350,410 Z" fill="#C4101F" stroke-width="2"/>

    <!-- ledger page stuck to the face -->
    <g transform="rotate(-6 300 418)">
      <path d="M248,364 L352,364 L352,450 L336,472 L248,472 Z" fill="#E9E1CF" stroke="#0E0B10" stroke-width="2.5"/>
      <path d="M352,450 L336,472 L340,454 Z" fill="#C9BFA8" stroke="#0E0B10" stroke-width="2"/>
      <g stroke="#9A958C" stroke-width="1" fill="none">
        <path d="M252,380 L348,380 M252,394 L348,394 M252,408 L348,408 M252,422 L348,422 M252,436 L348,436 M252,450 L344,450 M252,464 L336,464"/>
      </g>
      <path d="M266,366 L266,470 M270,366 L270,470" stroke="#E5172F" stroke-width="1" fill="none"/>
      <path d="M322,366 L322,470" stroke="#0E0B10" stroke-width="0.8" fill="none" opacity="0.5"/>
      <!-- scribbled figures (not legible) -->
      <g stroke="#0E0B10" stroke-width="1.4" fill="none">
        <path d="M276,376 c3,-6 6,4 9,-2 c3,-5 5,3 8,-1"/><path d="M328,376 c2,-5 4,3 6,-1 l6,0"/>
        <path d="M278,390 c4,-5 6,3 10,-1"/><path d="M330,390 l4,-5 l0,6 m4,-6 c3,0 3,6 0,6"/>
        <path d="M328,404 c2,-4 6,-4 6,0 c0,4 -6,4 -6,0 m10,0 l6,0"/>
        <path d="M276,446 c3,-6 6,4 9,-2 c3,-5 5,3 8,-1 c3,-4 5,2 7,0"/>
      </g>
      <path d="M326,418 L344,418 M326,432 L346,428" stroke="#E5172F" stroke-width="1.6" fill="none"/>
      <!-- smile showing through the paper -->
      <path d="M278,430 Q300,450 322,430" fill="none" stroke="#E5172F" stroke-width="3" opacity="0.45"/>
    </g>
  </g>

  <!-- dissolving edges: floating red strokes & ruled-line fragments -->
  <g fill="none" stroke="#E5172F" stroke-linecap="round">
