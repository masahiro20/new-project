    <path d="M430,560 c-6,4 0,14 6,8" stroke-width="2.2" opacity="0.6"/>
    <path d="M412,760 l12,0 m-4,-6 c4,2 4,10 0,12" stroke-width="2.2" opacity="0.65"/>
