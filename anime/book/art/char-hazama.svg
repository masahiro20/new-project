    <path d="M318,980 C313,988 314,996 319,996 C324,996 325,988 318,980 Z" opacity="0.9"/>
    <path d="M284,1070 C280,1076 281,1082 285,1082 C289,1082 290,1076 284,1070 Z" opacity="0.8"/>
    <path d="M316,1120 C312,1126 313,1131 317,1131 C321,1131 322,1126 316,1120 Z" opacity="0.7"/>
    <path d="M296,1170 C293,1175 294,1179 297,1179 C300,1179 301,1175 296,1170 Z" opacity="0.6"/>
  </g>

  <!-- whole child: soft ink glow behind -->
  <path d="M300,330 C350,330 372,370 370,420 C368,470 360,500 372,520 L392,660 C400,690 380,700 370,720 L340,890 L260,890 L230,720 C220,700 200,690 208,660 L228,520 C240,500 232,470 230,420 C228,370 250,330 300,330 Z" fill="#E5172F" opacity="0.45" filter="url(#blur)"/>

