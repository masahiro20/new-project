  <ellipse cx="300" cy="304" rx="46" ry="9" fill="none" stroke="#FF6B7A" stroke-width="2.4"/>
  <ellipse cx="300" cy="304" rx="38" ry="6" fill="none" stroke="#E5172F" stroke-width="1.2"/>

