<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1300" width="600" height="1300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181B25"/>
      <stop offset="0.55" stop-color="#12141B"/>
      <stop offset="1" stop-color="#0B0C11"/>
    </linearGradient>
    <pattern id="rule" width="600" height="34" patternUnits="userSpaceOnUse">
      <line x1="0" y1="33.5" x2="600" y2="33.5" stroke="#232838" stroke-width="1"/>
    </pattern>
    <radialGradient id="aura" cx="300" cy="560" r="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E5172F" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#7A0614" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7A0614" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floor" cx="300" cy="1242" r="200" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 1056) scale(1 0.15)">
      <stop offset="0" stop-color="#E5172F" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E5172F" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="soft" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- backdrop -->
  <rect width="600" height="1300" fill="url(#bg)"/>
  <rect width="600" height="1300" fill="url(#rule)"/>
  <line x1="64" y1="0" x2="64" y2="1300" stroke="#E5172F" stroke-opacity="0.16"/>
  <line x1="70" y1="0" x2="70" y2="1300" stroke="#E5172F" stroke-opacity="0.16"/>
  <rect width="600" height="1300" fill="url(#aura)"/>
  <rect x="0" y="1180" width="600" height="120" fill="url(#floor)"/>
  <ellipse cx="300" cy="1242" rx="150" ry="14" fill="#06070A" opacity="0.8"/>

    <!-- floor puddle + falling drops -->
  <ellipse cx="300" cy="1236" rx="70" ry="10" fill="#E5172F" opacity="0.5" filter="url(#blur)"/>
  <path d="M248,1236 C252,1226 290,1224 300,1228 C320,1222 350,1226 352,1236 C340,1244 262,1246 248,1236 Z" fill="#E5172F" stroke="#7A0614" stroke-width="2.5"/>
  <path d="M272,1232 C284,1228 300,1228 312,1230" stroke="#FF6B7A" stroke-width="2" fill="none"/>
  <g fill="#E5172F" stroke="#7A0614" stroke-width="2">
