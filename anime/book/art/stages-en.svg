<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600" xml:lang="en" role="img" aria-labelledby="title desc">
<title id="title">DEFAULT: three stages</title>
<desc id="desc">Three growth stages of Jin’s power: 1 Touch (Episode 1), 2 Area (5 m radius), 3 Take Over.</desc>
<rect width="1240" height="600" fill="#F3F1E7"/><text x="60" y="66" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace, sans-serif" font-size="16" fill="#C8102E" font-weight="600" letter-spacing="0.14em">THREE STAGES OF DEFAULT</text><text x="60" y="112" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="36" fill="#1A1C26">DEFAULT: Three Stages</text><path d="M60 134H1180" stroke="#1A1C26" stroke-width="2"/><path d="M60 140H1180" stroke="#1A1C26" stroke-width="1"/><rect x="60" y="170" width="340" height="400" rx="12" fill="#FFFFFF" fill-opacity="0.55" stroke="#1A1C26" stroke-width="2.5"/><rect x="80" y="190" width="300" height="130" rx="8" fill="#E6E8DA"/><g transform="translate(80 190)"><circle cx="96" cy="65" r="22" fill="#E5172F" stroke="#1A1C26" stroke-width="2.5"/><path d="M120 65H176" stroke="#E5172F" stroke-width="4" stroke-dasharray="2 7" stroke-linecap="round"/><circle cx="204" cy="65" r="22" fill="#FFFFFF" stroke="#1A1C26" stroke-width="2.5"/><path d="M190 69L218 61" stroke="#E5172F" stroke-width="4" stroke-linecap="round"/><circle cx="204" cy="65" r="34" fill="none" stroke="#9AA3AD" stroke-width="3" stroke-dasharray="5 5"/><text x="150" y="120" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace, sans-serif" font-size="16" fill="#5A5F59" text-anchor="middle" font-weight="600">×1</text></g><text x="84" y="354" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace, sans-serif" font-size="14" fill="#C8102E" font-weight="600" letter-spacing="0.14em">STAGE 1</text><g><rect x="316" y="342" width="14" height="14" rx="2" fill="#C8102E" stroke="#C8102E" stroke-width="2"/><rect x="336" y="342" width="14" height="14" rx="2" fill="none" stroke="#C8102E" stroke-width="2"/><rect x="356" y="342" width="14" height="14" rx="2" fill="none" stroke="#C8102E" stroke-width="2"/></g><text x="84" y="398" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="30" fill="#1A1C26">Touch</text><text x="84" y="428" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="17" fill="#5A5F59">Touch Default</text><text x="84" y="466" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="17" fill="#1A1C26">Seizes one person’s borrowed</text><text x="84" y="494" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="17" fill="#1A1C26">power for about 3 seconds.</text><path d="M80 516H380" stroke="#BFC9B3" stroke-width="1.5"/><rect x="80" y="528" width="300" height="28" rx="14" fill="#1A1C26" stroke="#1A1C26" stroke-width="1.5"/><text x="230" y="548" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">First seen: Episode 1</text><path d="M410 255H440M430 245L440 255L430 265" fill="none" stroke="#1A1C26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="450" y="170" width="340" height="400" rx="12" fill="#FFFFFF" fill-opacity="0.55" stroke="#1A1C26" stroke-width="2.5"/><rect x="470" y="190" width="300" height="130" rx="8" fill="#E6E8DA"/><g transform="translate(470 190)"><ellipse cx="150" cy="70" rx="120" ry="52" fill="#C8102E" fill-opacity="0.08" stroke="#C8102E" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M150 70H270" stroke="#1A1C26" stroke-width="1.5"/><path d="M262 64L270 70L262 76" fill="none" stroke="#1A1C26" stroke-width="1.5"/><text x="222" y="62" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace, sans-serif" font-size="14" fill="#1A1C26" text-anchor="middle" font-weight="600">r = 5m</text><circle cx="80" cy="50" r="11" fill="#FFFFFF" stroke="#1A1C26" stroke-width="2"/><circle cx="80" cy="50" r="5" fill="#FF5A1F" opacity="0.35"/><path d="M72 53L88 47" stroke="#E5172F" stroke-width="3" stroke-linecap="round"/><circle cx="104" cy="98" r="11" fill="#FFFFFF" stroke="#1A1C26" stroke-width="2"/><circle cx="104" cy="98" r="5" fill="#9AA3AD" opacity="0.35"/><path d="M96 101L112 95" stroke="#E5172F" stroke-width="3" stroke-linecap="round"/><circle cx="196" cy="100" r="11" fill="#FFFFFF" stroke="#1A1C26" stroke-width="2"/><circle cx="196" cy="100" r="5" fill="#4F63E8" opacity="0.35"/><path d="M188 103L204 97" stroke="#E5172F" stroke-width="3" stroke-linecap="round"/><circle cx="242" cy="96" r="11" fill="#FFFFFF" stroke="#1A1C26" stroke-width="2"/><circle cx="242" cy="96" r="5" fill="#F0921E" opacity="0.35"/><path d="M234 99L250 93" stroke="#E5172F" stroke-width="3" stroke-linecap="round"/><circle cx="62" cy="84" r="11" fill="#FFFFFF" stroke="#1A1C26" stroke-width="2"/><circle cx="62" cy="84" r="5" fill="#2FC48D" opacity="0.35"/><path d="M54 87L70 81" stroke="#E5172F" stroke-width="3" stroke-linecap="round"/><circle cx="150" cy="70" r="16" fill="#E5172F" stroke="#1A1C26" stroke-width="2.5"/><path d="M138 70L130 70M162 70L170 70M150 58V50M150 82V90" stroke="#E5172F" stroke-width="3"/></g><text x="474" y="354" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace, sans-serif" font-size="14" fill="#C8102E" font-weight="600" letter-spacing="0.14em">STAGE 2</text><g><rect x="706" y="342" width="14" height="14" rx="2" fill="#C8102E" stroke="#C8102E" stroke-width="2"/><rect x="726" y="342" width="14" height="14" rx="2" fill="#C8102E" stroke="#C8102E" stroke-width="2"/><rect x="746" y="342" width="14" height="14" rx="2" fill="none" stroke="#C8102E" stroke-width="2"/></g><text x="474" y="398" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="30" fill="#1A1C26">Area</text><text x="474" y="428" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="17" fill="#5A5F59">Area Default</text><text x="474" y="466" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="17" fill="#1A1C26">Slam the left hand down: hits</text><text x="474" y="494" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="17" fill="#1A1C26">everyone within 5 m — allies too.</text><path d="M470 516H770" stroke="#BFC9B3" stroke-width="1.5"/><rect x="470" y="528" width="300" height="28" rx="14" fill="none" stroke="#1A1C26" stroke-width="1.5" stroke-dasharray="4 4"/><text x="620" y="548" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="15" fill="#1A1C26" text-anchor="middle" font-weight="700">Coming soon</text><path d="M800 255H830M820 245L830 255L820 265" fill="none" stroke="#1A1C26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="840" y="170" width="340" height="400" rx="12" fill="#FFFFFF" fill-opacity="0.55" stroke="#1A1C26" stroke-width="2.5" stroke-dasharray="10 6"/><rect x="860" y="190" width="300" height="130" rx="8" fill="#E6E8DA"/><g transform="translate(860 190)"><rect x="30" y="40" width="80" height="50" rx="8" fill="#FFFFFF" stroke="#1A1C26" stroke-width="2.5" stroke-dasharray="5 4"/><path d="M30 58H110M30 68H110" stroke="#2FC48D" stroke-width="3" opacity="0.4"/><path d="M122 65H170M160 55L172 65L160 75" fill="none" stroke="#1A1C26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="186" y="40" width="90" height="50" rx="8" fill="#E5172F" stroke="#1A1C26" stroke-width="2.5"/><path d="M186 58H276M186 68H276" stroke="#7A0614" stroke-width="3"/><path d="M231 40V90" stroke="#2FC48D" stroke-width="7"/><path d="M231 40V90" stroke="#1A1C26" stroke-width="1" opacity="0.5"/><text x="70" y="118" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace, sans-serif" font-size="16" fill="#5A5F59" text-anchor="middle" font-weight="600">0</text><text x="231" y="118" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace, sans-serif" font-size="16" fill="#C8102E" text-anchor="middle" font-weight="600">+1</text></g><text x="864" y="354" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace, sans-serif" font-size="14" fill="#C8102E" font-weight="600" letter-spacing="0.14em">STAGE 3</text><g><rect x="1096" y="342" width="14" height="14" rx="2" fill="#C8102E" stroke="#C8102E" stroke-width="2"/><rect x="1116" y="342" width="14" height="14" rx="2" fill="#C8102E" stroke="#C8102E" stroke-width="2"/><rect x="1136" y="342" width="14" height="14" rx="2" fill="#C8102E" stroke="#C8102E" stroke-width="2"/></g><text x="864" y="398" font-family="'Dela Gothic One', 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="30" fill="#1A1C26">Take Over</text><text x="864" y="428" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="17" fill="#5A5F59">Shouldering the debt</text><text x="864" y="466" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="17" fill="#1A1C26">With consent, takes on someone’s</text><text x="864" y="494" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="17" fill="#1A1C26">whole debt and contract.</text><path d="M860 516H1160" stroke="#BFC9B3" stroke-width="1.5"/><rect x="860" y="528" width="300" height="28" rx="14" fill="none" stroke="#1A1C26" stroke-width="1.5" stroke-dasharray="4 4"/><text x="1010" y="548" font-family="'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="15" fill="#1A1C26" text-anchor="middle" font-weight="700">Coming soon</text>
</svg>
