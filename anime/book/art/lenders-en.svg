<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" width="1240" height="900" xml:lang="en" role="img" aria-labelledby="title desc">
<title id="title">Emblems of the Seven Lenders</title>
<desc id="desc">Seven emblems in their mark colors: Kanagi, the Iron Lender; Hikube, the Flame Lender; Miharu, the Eye Lender; Tokihaya, the Speed Lender; Narihibiki, the Voice Lender; Uruoi, the Abundance Lender; Hazama, the Zero Lender.</desc>
