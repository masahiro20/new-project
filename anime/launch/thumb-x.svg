<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">LEDGERBREAKER 帳簿の書 Vol.0 — X announcement image</title>
  <desc id="d">16:9 announcement image. Left: Jin raising his glowing red ledger-marked arm toward the city. Right: LEDGERBREAKER (LEDGER / BREAKER), 帳簿破り, 帳簿の書 Vol.0, 設定資料集 PDF, BOOTH ¥500 / Ko-fi $4.</desc>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E0B10" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0E0B10" stop-opacity="0.1"/>
      <stop offset="0.66" stop-color="#0E0B10" stop-opacity="0.92"/>
      <stop offset="0.72" stop-color="#0E0B10" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.68" stop-color="#0E0B10" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#0E0B10" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#0E0B10" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#0E0B10"/>
  <!-- key visual, shifted so Jin and the sun sit on the left -->
  <image href="../visuals/key-visual.png" x="-60" y="0" width="1600" height="900" preserveAspectRatio="none"/>
  <rect width="1600" height="900" fill="url(#bottom)"/>
  <rect width="1600" height="900" fill="url(#fade)"/>

  <path d="M1080 0V900M1090 0V900" stroke="#E5172F" stroke-opacity="0.45" stroke-width="2"/>

  <g transform="translate(1130 0)">
    <rect y="120" width="300" height="62" fill="#E5172F"/>
    <text x="150" y="163" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="34" fill="#F5EEDD" letter-spacing="2">設定資料集 PDF</text>

    <text x="-2" y="350" font-family="'Dela Gothic One',sans-serif" font-size="80" fill="#E5172F" filter="url(#glow)" textLength="420" lengthAdjust="spacingAndGlyphs">LEDGER</text>
    <text x="-2" y="450" font-family="'Dela Gothic One',sans-serif" font-size="80" fill="#E5172F" filter="url(#glow)" textLength="420" lengthAdjust="spacingAndGlyphs">BREAKER</text>
    <text x="2" y="510" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="700" font-size="38" fill="#F5EEDD" letter-spacing="18">帳簿破り</text>
    <rect x="2" y="538" width="418" height="3" fill="#E5172F"/>

    <text x="0" y="618" font-family="'Dela Gothic One',sans-serif" font-size="56" fill="#F5EEDD">帳簿の書 <tspan fill="#E5172F">Vol.0</tspan></text>
    <text x="2" y="664" font-family="'IBM Plex Mono',monospace" font-weight="500" font-size="20" fill="#E9E1CF">Book of the Ledger · A5 · 30p · PDF</text>

    <g transform="translate(0 700)" font-family="'IBM Plex Mono',monospace" font-weight="700">
      <rect width="420" height="70" fill="none" stroke="#C9A24A" stroke-width="2.5"/>
      <text x="22" y="47" font-size="30" fill="#F5EEDD">BOOTH <tspan fill="#C9A24A">¥500</tspan></text>
      <text x="398" y="47" text-anchor="end" font-size="30" fill="#F5EEDD">Ko-fi <tspan fill="#C9A24A">$4</tspan></text>
    </g>
    <text x="2" y="816" font-family="'Zen Kaku Gothic New',sans-serif" font-size="18" fill="#9A958C">すべて生成AIで制作（作者が確認・選定）</text>
    <text x="2" y="842" font-family="'Zen Kaku Gothic New',sans-serif" font-size="15" fill="#9A958C">Made entirely with generative AI · reviewed by the creator</text>
  </g>
</svg>
