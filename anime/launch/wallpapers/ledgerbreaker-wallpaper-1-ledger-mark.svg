      <stop offset="0.6" stop-color="#7A0614" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#7A0614" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="calm" x1="0" y1="0" x2="0" y2="1">
