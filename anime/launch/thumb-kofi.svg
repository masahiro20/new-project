<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-labelledby="t d">
  <title id="t">LEDGERBREAKER — Book of the Ledger Vol.0 — Ko-fi thumbnail</title>
  <desc id="d">Square product thumbnail. Top: the city under a red sun. Middle band (safe for a 2:1 or 5:4 crop): LEDGERBREAKER (LEDGER / BREAKER), 帳簿破り, Book of the Ledger Vol.0, setting book PDF, $4. Bottom: the eight main characters in silhouette lineup.</desc>
  <defs>
    <linearGradient id="topfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E0B10" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="#0E0B10" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0E0B10" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="botfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E0B10" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#0E0B10" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0E0B10" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="topclip"><rect width="1200" height="360"/></clipPath>
    <clipPath id="botclip"><rect y="880" width="1200" height="320"/></clipPath>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="#0E0B10"/>

  <!-- top: red sun + summit (crop of visuals/key-visual.png) -->
  <g clip-path="url(#topclip)">
    <image href="../visuals/key-visual.png" x="-520" y="-20" width="2080" height="1170" preserveAspectRatio="none"/>
    <rect width="1200" height="360" fill="url(#topfade)"/>
  </g>

  <!-- bottom: cast lineup (crop of visuals/characters-lineup.png) -->
  <g clip-path="url(#botclip)">
    <image href="../visuals/characters-lineup.png" x="0" y="780" width="1200" height="525" preserveAspectRatio="none"/>
    <rect y="880" width="1200" height="320" fill="url(#botfade)"/>
  </g>

  <!-- ledger rules -->
  <path d="M0 330H1200M0 900H1200" stroke="#E5172F" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M64 0V1200M74 0V1200" stroke="#E5172F" stroke-opacity="0.3" stroke-width="2"/>

  <!-- safe band 300–900 -->
  <g transform="translate(110 0)">
    <rect y="352" width="310" height="58" fill="#E5172F"/>
    <text x="155" y="392" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-weight="700" font-size="28" fill="#F5EEDD" textLength="270" lengthAdjust="spacingAndGlyphs">SETTING BOOK PDF</text>

    <text x="-2" y="524" font-family="'Dela Gothic One',sans-serif" font-size="120" fill="#E5172F" filter="url(#glow)">LEDGER</text>
    <text x="-2" y="640" font-family="'Dela Gothic One',sans-serif" font-size="120" fill="#E5172F" filter="url(#glow)">BREAKER</text>
    <text x="770" y="640" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="700" font-size="46" fill="#F5EEDD" letter-spacing="22">帳簿破り</text>

    <text x="0" y="712" font-family="'Dela Gothic One',sans-serif" font-size="66" fill="#F5EEDD">Book of the Ledger <tspan fill="#E5172F">Vol.0</tspan></text>
    <text x="2" y="770" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="700" font-size="32" fill="#E9E1CF">帳簿の書 Vol.0</text>
    <text x="2" y="840" font-family="'IBM Plex Mono',monospace" font-weight="500" font-size="30" fill="#E9E1CF">A5 · 30 pages · PDF · English</text>

    <g transform="translate(760 742)">
      <rect width="230" height="118" fill="#0E0B10" stroke="#C9A24A" stroke-width="3"/>
      <text x="115" y="82" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-weight="700" font-size="72" fill="#F5EEDD">$4</text>
    </g>
  </g>

  <rect y="1140" width="1200" height="60" fill="#0E0B10" fill-opacity="0.88"/>
  <text x="1090" y="1178" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="20" fill="#9A958C">Made entirely with generative AI · reviewed by the creator · © 2026 masahiro20 / P7 Anime</text>
</svg>
